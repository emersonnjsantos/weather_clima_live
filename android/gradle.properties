org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Aumenta o timeout de rede para 120 segundos (padr\u00e3o \u00e9 30s, muito curto em redes lentas)
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
# Ativa o daemon e cache de configura\u00e7\u00e3o para builds mais r\u00e1pidas
org.gradle.daemon=true
org.gradle.caching=true
# Evita tentativas paralelas que podem sobrecarregar a conex\u00e3o
org.gradle.parallel=false
